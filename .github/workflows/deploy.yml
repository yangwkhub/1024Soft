name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || format('/{0}', github.event.repository.name) }}
      PUBLIC_REPO_URL: ${{ vars.PUBLIC_REPO_URL || format('{0}/{1}', github.server_url, github.repository) }}
      PUBLIC_REPO_OWNER: ${{ vars.PUBLIC_REPO_OWNER || github.repository_owner }}
      PUBLIC_REPO_NAME: ${{ vars.PUBLIC_REPO_NAME || github.event.repository.name }}
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_GISCUS_MAPPING: ${{ vars.PUBLIC_GISCUS_MAPPING || 'pathname' }}
      PUBLIC_GISCUS_LANG: ${{ vars.PUBLIC_GISCUS_LANG || 'zh-CN' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Build + generate search index
        run: npm run build
      # 全站 HTTPS：npm run build 内的 check-https.mjs 已扫描产物，这里再守住站点 URL 配置
      - name: Verify HTTPS configuration
        run: |
          case "$PUBLIC_SITE_URL" in
            https://*) echo "站点 URL 已使用 HTTPS：$PUBLIC_SITE_URL" ;;
            *) echo "::error::PUBLIC_SITE_URL 必须以 https:// 开头（当前：$PUBLIC_SITE_URL）"; exit 1 ;;
          esac
      # GitHub Pages 默认会跑 Jekyll，跳过以免忽略下划线开头的 _pagefind 目录
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - name: Summary
        run: |
          echo "### 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "站点：$PUBLIC_SITE_URL  基路径：$PUBLIC_BASE_PATH" >> "$GITHUB_STEP_SUMMARY"
          echo "生成页面：$(find dist -name '*.html' | wc -l) 个" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTPS：产物已通过 check-https.mjs（无明文 HTTP，canonical / sitemap / RSS 全部为 https）" >> "$GITHUB_STEP_SUMMARY"
          echo "发布后请在 Settings → Pages 勾选 Enforce HTTPS；静态产物由 GitHub 终止 TLS，无法自行发送 HSTS 响应头" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
